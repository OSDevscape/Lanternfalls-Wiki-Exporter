<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1a120a">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>Lanternfalls Wiki Exporter</title>
    <style>
        :root {
            color-scheme: dark;
            --black: #0f0f0f;
            --deep: #1a120a;
            --brown: #694d23;
            --gold: #e6a519;
            --yellow: #ffcf3f;
            --text: #f5e8ba;
            --muted: #d0bd97;
            --danger: #7b2d23;
            --selected: #5a451f;
            --touch: 44px
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100dvh;
            background: radial-gradient(circle at top, #5a421f, #2d1f12 32rem, #0f0f0f 100%);
            color: var(--text);
            font: 15px/1.45 Georgia, serif
        }

        button,
        input,
        textarea,
        select,
        label {
            font: 14px/1.35 system-ui, sans-serif
        }

        button,
        .file-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 12px;
            color: #f7e7a8;
            background: linear-gradient(#765728, #4e3518 55%, #33220f);
            border: 2px solid #1c1309;
            border-radius: 5px;
            box-shadow: inset 0 1px rgba(255, 231, 155, .34), inset 0 -2px rgba(0, 0, 0, .42), 0 1px #ad8846;
            cursor: pointer
        }

        button:hover,
        .file-label:hover {
            filter: brightness(1.15)
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .primary {
            background: linear-gradient(#b58527, #765018 55%, #45300f);
            color: #fff2b6
        }

        .app {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            min-height: 100dvh
        }

        header {
            padding: 16px 20px;
            background: linear-gradient(#3d2b16, #1b130b);
            border-bottom: 2px solid #806129;
            box-shadow: 0 2px 8px #0008
        }

        header h1 {
            margin: 0;
            color: var(--yellow);
            font-size: 22px;
            text-shadow: 2px 2px #2b1706
        }

        header p {
            margin: 5px 0 0;
            color: #e3cd9c;
            font: 13px system-ui
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding: 10px 20px;
            background: linear-gradient(#4a4032, #201e1b);
            border-bottom: 2px solid #6e5930
        }

        .spacer {
            flex: 1
        }

        .toolbar input[type=search] {
            width: min(320px, 100%)
        }

        .mobile-only {
            display: inline-flex;
        }

        .workspace {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(275px, 32%) minmax(0, 1fr)
        }

        aside {
            overflow: auto;
            padding: 12px;
            background: linear-gradient(90deg, #382d1a, #20180e);
            border-right: 2px solid #8e6a31
        }

        main {
            overflow: auto;
            padding: 24px
        }

        .tree-meta {
            margin: 0 0 8px;
            padding: 8px;
            color: #e8d29c;
            font: 12px system-ui;
            background: #21170d;
            border: 1px solid #725327;
            border-radius: 4px
        }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            min-height: 48px;
            padding: 7px 10px;
            color: var(--text);
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px
        }

        .tree-row:hover {
            background: #695122
        }

        .tree-row.selected {
            background: #7a5b24;
            border-color: var(--yellow)
        }

        .tree-row .twisty {
            display: inline-grid;
            place-items: center;
            flex: 0 0 32px;
            align-self: stretch;
            margin: -7px 0 -7px -10px;
            cursor: pointer;
            border-right: 1px solid rgba(230, 165, 25, .22);
            font-size: 17px
        }

        .tree-row .twisty:hover {
            background: rgba(230, 165, 25, .16)
        }

        .tree-row .name {
            overflow: hidden;
            text-overflow: ellipsis
        }

        .tree-children {
            border-left: 1px solid #765b2a;
            margin-left: 12px
        }

        .panel {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(145deg, #2b2114, #17110b);
            border: 1px solid #96743a;
            border-radius: 7px;
            box-shadow: 0 4px 18px #0009
        }

        .panel h2 {
            margin: 0 0 15px;
            color: var(--yellow)
        }

        .field {
            margin: 12px 0
        }

        .field label,
        .section-title {
            display: block;
            margin-bottom: 5px;
            color: #f4db8b;
            font-weight: bold
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px;
            color: #f9e9b6;
            background: #130e09;
            border: 1px solid #896e3c;
            border-radius: 4px
        }

        textarea {
            min-height: 120px;
            resize: vertical
        }

        .small {
            min-height: 70px
        }

        .section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #70552a
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px
        }

        .right {
            margin-left: auto
        }

        .warning {
            color: #ffd1b1;
            background: linear-gradient(#793a28, #4b2016 55%, #2b120c)
        }

        .notice,
        .entry {
            padding: 12px;
            margin: 9px 0;
            background: #21170d;
            border: 1px solid #725327;
            border-radius: 4px
        }

        .entry {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center
        }

        .entry span {
            min-width: 0
        }

        .entry small,
        .hint,
        .picker small {
            color: var(--muted)
        }

        .tagline {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 4px 7px;
            color: #301e06;
            background: #d9af42;
            border-radius: 12px;
            font: 12px system-ui
        }

        .tag button {
            min-height: 20px;
            padding: 0 5px;
            color: #3b2106;
            background: transparent;
            border: 0;
            box-shadow: none
        }

        .preview {
            display: block;
            max-width: 180px;
            max-height: 120px;
            margin-top: 6px;
            border: 1px solid #a58646
        }

        .picker {
            padding: 12px;
            background: #21170d;
            border: 1px solid #725327;
            border-radius: 4px
        }

        .native-file {
            display: none
        }

        footer {
            padding: 8px 20px;
            color: #d9c28a;
            font: 12px system-ui;
            background: #1a120a;
            border-top: 1px solid #6e5930
        }

        .ok {
            color: #b9e69c
        }

        .error {
            color: #ffaaa0
        }

        dialog {
            width: min(600px, 92vw);
            color: var(--text);
            background: #21170d;
            border: 2px solid #a27a34;
            border-radius: 7px
        }

        dialog::backdrop {
            background: #000a
        }

        #backToEditor {
            display: none;
        }

        @media (max-width: 800px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .workspace>aside {
                display: none;
            }

            body.files-open>aside {
                display: block;
                position: fixed;
                z-index: 9999;
                inset: 0;
                width: 100%;
                min-height: 100dvh;
                padding: 12px;
                overflow-y: auto;
                background: linear-gradient(90deg, #382d1a, #20180e);
                border: 0;
                box-shadow: none;
            }

            body.files-open #backToEditor {
                display: inline-flex;
                width: 100%;
                min-height: 48px;
                margin: 0 0 12px;
                padding: 10px 14px;
                justify-content: flex-start;
                color: #1a120a;
                background: #ffcf3f;
                border: 2px solid #fff2b6;
                border-radius: 5px;
                box-shadow: 0 2px 4px rgba(0, 0, 0, .45);
                font-weight: 700;
            }

            body.files-open .app {
                display: none;
            }

            .mobile-only {
                display: inline-flex;
            }

            main {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <h1>Lanternfalls Wiki Exporter</h1>
        </header>
        <div class="toolbar"><label for="backupPicker" class="file-label primary">Open file system</label><input
                id="backupPicker" class="native-file" type="file" accept=".json,application/json"><button
                id="filesButton" class="mobile-only" disabled>Files</button><button id="expandAll" disabled>Expand
                all</button><button id="collapseAll" disabled>Collapse all</button><button id="newFolder" disabled>New
                folder</button><button id="newPage" disabled>New page</button><button id="validate"
                class="desktop-extra" disabled>Validate</button><button id="download" class="primary" disabled>Download
                website ZIP</button>
            <div class="spacer"></div><input id="search" type="search" placeholder="Search folders and pages" disabled>
        </div>
        <div id="workspace" class="workspace">
            <aside id="fileTreePanel">
                <p id="treeMeta" class="tree-meta">No backup loaded.</p>
                <div id="tree"></div>
            </aside>
            <main id="main"></main>
        </div>
        <footer><span id="status">Choose a backup JSON file to begin.</span></footer>
    </div>
    <dialog id="modal">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="actions"><button id="closeModal" class="primary">Close</button></div>
    </dialog>
    <script>
        const S = { data: null, outer: null, selected: null, expanded: new Set(), dirty: false, legacyImages: new Map(), directImages: new Map(), search: "" }; const E = { backup: document.querySelector('#backupPicker'), tree: document.querySelector('#tree'), meta: document.querySelector('#treeMeta'), main: document.querySelector('#main'), status: document.querySelector('#status'), search: document.querySelector('#search'), newFolder: document.querySelector('#newFolder'), newPage: document.querySelector('#newPage'), download: document.querySelector('#download'), validate: document.querySelector('#validate'), files: document.querySelector('#filesButton'), expandAll: document.querySelector('#expandAll'), collapseAll: document.querySelector('#collapseAll'), modal: document.querySelector('#modal'), modalTitle: document.querySelector('#modalTitle'), modalBody: document.querySelector('#modalBody') };
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); const formatCreationDate = v => { let d = new Date(Number(v)); return Number.isNaN(d.getTime()) ? '' : String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() }; const parseCreationDate = v => { let m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v).trim()); if (!m) throw new Error('Creation date must use DD/MM/YYYY.'); let day = Number(m[1]), month = Number(m[2]), year = Number(m[3]), d = new Date(year, month - 1, day); if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) throw new Error('Creation date is not a valid calendar date.'); return d.getTime() }; const clean = (v, f = 'Untitled') => { let x = String(v ?? '').replace(/[\\/:*?"<>|\0-\x1f]/g, '-').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, ''); return (x || f).slice(0, 140) }; const set = (m, k = '') => { E.status.textContent = m; E.status.className = k }; const folders = () => S.data?.categories ?? []; const pages = () => S.data?.subjects ?? []; const getFolder = id => folders().find(x => x.id === Number(id)); const getPage = id => pages().find(x => x.id === Number(id)); const notes = id => (S.data?.subjectNotes ?? []).filter(x => Number(x.subject_id) === Number(id)); const photos = id => (S.data?.subjectPhotos ?? []).filter(x => Number(x.subject_id) === Number(id)); const conn = id => (S.data?.connections ?? []).filter(x => Number(x.subject1_id) === Number(id) || Number(x.subject2_id) === Number(id)); const tagsFor = id => { let map = new Map((S.data?.subjectTags ?? []).map(x => [x.id, x])); return (S.data?.subjectTagsAttachments ?? []).filter(x => Number(x.subject_id) === Number(id)).map(x => map.get(x.tag_id ?? x.subjectTag_id ?? x.subject_tag_id)).filter(Boolean) }; const activeCampaign = () => S.data?.campaigns?.find(x => x.active)?.id ?? S.data?.campaigns?.[0]?.id ?? -1;
        function build() { if (!S.data) return []; let map = new Map(), roots = []; folders().forEach(x => map.set(x.id, { type: 'folder', source: x, children: [] })); map.forEach(n => { let p = n.source.parentCategory_id; if (p === -1 || !map.has(p) || p === n.source.id) roots.push(n); else map.get(p).children.push(n) }); pages().forEach(x => { let n = { type: 'page', source: x, children: [] }, p = map.get(x.category_id); p ? p.children.push(n) : roots.push(n) }); let sort = xs => { xs.sort((a, b) => Number(b.source.orderPriority ?? 0) - Number(a.source.orderPriority ?? 0) || (a.source.name || '').localeCompare(b.source.name || '', undefined, { numeric: true })); xs.forEach(x => x.type === 'folder' && sort(x.children)) }; sort(roots); return roots }
        function renderTree() {
            E.tree.innerHTML = ''; if (!S.data) return; E.meta.textContent = `${folders().length} folders · ${pages().length} pages${S.dirty ? ' · unsaved edits' : ''}`; let q = S.search.toLowerCase(); function has(n) { return !q || (`${n.source.name ?? ''}\n${n.source.description ?? ''}\n${n.source.fullDescription ?? ''}`).toLowerCase().includes(q) || (n.children || []).some(has) } function draw(n, d) {
                if (!has(n)) return null; let folder = n.type === 'folder', open = q || S.expanded.has(n.source.id), row = document.createElement('button'), wrap = document.createElement('div'); row.className = `tree-row ${n.type}${S.selected?.type === n.type && S.selected?.id === n.source.id ? ' selected' : ''}`; row.style.paddingLeft = `${10 + d * 16}px`; row.innerHTML = `<span class="twisty">${folder ? (n.children.length ? (open ? '▾' : '▸') : '·') : ''}</span><span>${folder ? '📁' : '🌐'}</span><span class="name">${esc(n.source.name || 'Untitled')}</span>`; row.onclick = e => {
                    if (folder && e.target.closest('.twisty') && n.children.length && !q) { S.expanded.has(n.source.id) ? S.expanded.delete(n.source.id) : S.expanded.add(n.source.id); renderTree() } else {
                        S.selected = {
                            type: n.type,
                            id: n.source.id
                        };

                        if (window.innerWidth <= 800) {
                            const treePanel = document.querySelector('aside');
                            const workspace = document.querySelector('#workspace');

                            if (treePanel && workspace) {
                                workspace.insertBefore(treePanel, workspace.firstChild);
                            }

                            document.body.classList.remove('files-open');
                        }

                        render();
                    }
                }; wrap.append(row); if (folder && open) { let kids = document.createElement('div'); kids.className = 'tree-children'; n.children.forEach(c => { let v = draw(c, d + 1); if (v) kids.append(v) }); if (kids.childElementCount) wrap.append(kids) } return wrap
            } build().forEach(n => { let v = draw(n, 0); if (v) E.tree.append(v) })
        }
        function mark(m) { S.dirty = true; set(m, 'ok') } function optionList(selected, exclude = new Set()) { return `<option value="-1">— Root level —</option>` + folders().filter(x => !exclude.has(x.id)).map(x => `<option value="${x.id}" ${Number(selected) === x.id ? 'selected' : ''}>${esc(x.name || 'Untitled folder')}</option>`).join('') } function descendants(id) { let out = new Set([Number(id)]), again = true; while (again) { again = false; folders().forEach(x => { if (out.has(x.parentCategory_id) && !out.has(x.id)) { out.add(x.id); again = true } }) } return out } function nextId() { return Math.max(0, ...folders().map(x => x.id || 0), ...pages().map(x => x.id || 0)) + 1 }
        function welcome() { E.main.innerHTML = `<section class="panel"><h2>Open your Archive backup</h2><p>Use the styled <b>Open file system</b> button in the top bar.</p><div class="notice"><p>After loading, select a page to edit content, images, notes, tags, connections, and advanced fields.</p></div></section>` }
        function folderEditor(x) {
            E.main.innerHTML = `<section class="panel"><h2>Folder</h2><div class="field"><label>Name</label><input id="fName" value="${esc(x.name ?? '')}"></div><div class="field"><label>Parent folder</label><select id="fParent">${optionList(x.parentCategory_id, descendants(x.id))}</select></div><div class="field"><label>Order priority</label><input id="fOrder" type="number" value="${Number(x.orderPriority ?? 0)}"></div><div class="field"><label>Description</label><textarea id="fDesc" class="small">${esc(x.description ?? '')}</textarea></div><div class="actions"><button id="saveF" class="primary">Save folder</button><button id="addChild">Add page here</button><button id="deleteF" class="warning right">Delete folder</button></div></section>`; document.querySelector('#saveF').onclick = () => { x.name = document.querySelector('#fName').value.trim() || 'Untitled Folder'; x.parentCategory_id = Number(document.querySelector('#fParent').value); x.orderPriority = Number(document.querySelector('#fOrder').value || 0); x.description = document.querySelector('#fDesc').value; mark('Saved folder.'); render() }; document.querySelector('#addChild').onclick = () => newPage(x.id); document.querySelector('#deleteF').onclick = () => {
                const folderIdsToDelete = descendants(x.id);

                const pageIdsToDelete = new Set(
                    pages()
                        .filter(page => folderIdsToDelete.has(Number(page.category_id)))
                        .map(page => Number(page.id))
                );

                const folderCount = folderIdsToDelete.size;
                const pageCount = pageIdsToDelete.size;

                const confirmed = confirm(
                    `Delete "${x.name}" and everything inside it?\n\n` +
                    `${folderCount} folder(s) and ${pageCount} page(s) will be permanently deleted.`
                );

                if (!confirmed) return;

                /* Delete the selected folder and every nested subfolder. */
                S.data.categories = folders().filter(
                    folder => !folderIdsToDelete.has(Number(folder.id))
                );

                /* Delete every page stored in any deleted folder. */
                S.data.subjects = pages().filter(
                    page => !pageIdsToDelete.has(Number(page.id))
                );

                /* Delete notes belonging to deleted pages. */
                S.data.subjectNotes = (S.data.subjectNotes ?? []).filter(
                    note => !pageIdsToDelete.has(Number(note.subject_id))
                );

                /* Delete legacy image records belonging to deleted pages. */
                S.data.subjectPhotos = (S.data.subjectPhotos ?? []).filter(
                    photo => !pageIdsToDelete.has(Number(photo.subject_id))
                );

                /* Delete tag attachments belonging to deleted pages. */
                S.data.subjectTagsAttachments = (S.data.subjectTagsAttachments ?? []).filter(
                    attachment => !pageIdsToDelete.has(Number(attachment.subject_id))
                );

                /* Delete connections where either end points to a deleted page. */
                S.data.connections = (S.data.connections ?? []).filter(connection => {
                    return !pageIdsToDelete.has(Number(connection.subject1_id)) &&
                        !pageIdsToDelete.has(Number(connection.subject2_id));
                });

                /* Delete direct local images that were added in the exporter session. */
                pageIdsToDelete.forEach(pageId => {
                    S.directImages.delete(pageId);
                });

                /* Remove now-unused selected legacy image files from memory. */
                const stillUsedLegacyImages = new Set(
                    (S.data.subjectPhotos ?? [])
                        .map(photo => photo.imageName)
                        .filter(Boolean)
                );

                for (const imageName of S.legacyImages.keys()) {
                    if (!stillUsedLegacyImages.has(imageName)) {
                        S.legacyImages.delete(imageName);
                    }
                }

                S.selected = null;
                mark(`Deleted ${folderCount} folder(s) and ${pageCount} page(s).`);
                render();
            };
        }
        function advancedFields(x) { let known = ['id', 'name', 'category_id', 'creationDate', 'orderPriority', 'description', 'fullDescription', 'descriptionColorResourceName', 'iconColorResourceName', 'iconType', 'icon_id', 'nameColorResourceName']; let obj = {}; Object.keys(x).filter(k => !known.includes(k)).forEach(k => obj[k] = x[k]); return JSON.stringify(obj, null, 2) }
        function pageEditor(x) { let legacy = photos(x.id), direct = S.directImages.get(x.id) ?? [], nt = notes(x.id), tg = tagsFor(x.id), cs = conn(x.id); E.main.innerHTML = `<section class="panel"><h2>HTML Page</h2><div class="section"><span class="section-title">Identity</span><div class="field"><label>ID</label><input value="${x.id}" disabled></div><div class="field"><label>Name</label><input id="pName" value="${esc(x.name ?? '')}"></div><div class="field"><label>Folder</label><select id="pFolder">${optionList(x.category_id)}</select></div><div class="field"><label>Creation date</label><input id="pDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" pattern="\d{2}/\d{2}/\d{4}" value="${formatCreationDate(x.creationDate ?? Date.now())}"></div><div class="field"><label>Order priority</label><input id="pOrder" type="number" value="${Number(x.orderPriority ?? 0)}"></div></div><div class="section"><span class="section-title">Content</span><div class="field"><label>Short description</label><input id="pDesc" value="${esc(x.description ?? '')}"></div><div class="field"><label>Full description</label><textarea id="pBody">${esc(x.fullDescription ?? '')}</textarea></div></div><div class="section"><span class="section-title">Images</span><div class="picker"><span class="section-title">Add images directly to this page</span><label for="pageImages" class="file-label">Open image file system</label><input id="pageImages" class="native-file" type="file" accept="image/*" multiple><small>Direct images export in this page folder’s <code>images/</code> directory.</small></div><div class="list">${legacy.map((p, i) => `<div class="entry"><span>🖼️ ${esc(p.imageName || 'Unnamed legacy image')}<br><small>Legacy backup image · ${S.legacyImages.has(p.imageName) ? 'file selected' : 'no file selected'}</small></span><button class="removeLegacy warning" data-index="${i}">Remove legacy image</button></div>`).join('')}${direct.map((p, i) => `<div class="entry"><span>🖼️ ${esc(p.name)}<
